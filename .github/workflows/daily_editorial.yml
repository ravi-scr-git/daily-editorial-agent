name: Daily Editorial Pipeline

on:
  schedule:
    # 11:30 AM IST is 06:00 AM UTC (IST = UTC + 5:30)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium with system dependencies
        run: |
          playwright install chromium --with-deps

      - name: Execute Autonomous Scraper & Analysis Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agent_runner.py

      - name: Commit and push database and dashboard updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add editorials.db index.html
          git status
          git diff --staged --quiet || (git commit -m "Automated update: Daily editorials $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
